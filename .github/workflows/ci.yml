name: Dataset-independent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preprocessing-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn pytest
      - name: Run dataset-independent preprocessing tests
        run: python -m pytest -q tests/test_preprocessing_unit.py
